site_name: Trading Machine
site_description: Indian market instruments as Python objects - candles, quotes, analysis, orders, synthetic orders, positions and holdings, all through the Unified Broker Interface.
site_author: Pramod Athani
copyright: Copyright &copy; Pramod Athani
site_url: https://pramodathani.github.io/tradingmachine/
repo_url: https://github.com/pramodathani/tradingmachine
repo_name: pramodathani/tradingmachine
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/chart-line
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/vega@5
  - https://cdn.jsdelivr.net/npm/vega-lite@5
  - https://cdn.jsdelivr.net/npm/vega-embed@6

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: vegalite
          class: vegalite
          format: !!python/name:mkdocs_charts_plugin.fences.fence_vegalite
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

hooks:
  - scripts/documentation_hooks.py

plugins:
  - search
  - charts:
      vega_theme_light: default
      vega_theme_dark: dark
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            docstring_options:
              returns_named_value: false
              warn_unknown_params: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            show_if_no_docstring: false
            inherited_members: false
            members_order: source
            filters: ["!^_[^_]"]
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 96
            heading_level: 2

watch:
  - src

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Installation: get-started/installation.md
      - Configuration: get-started/configuration.md
      - First steps: get-started/first-steps.md
  - Python API:
      - python-api/index.md
      - Instruments: python-api/instruments.md
      - Market data: python-api/market-data.md
      - Finding instruments: python-api/discovery.md
      - Orders: python-api/orders.md
      - Price wrappers: python-api/price-wrappers.md
      - Positions: python-api/positions.md
      - Holdings: python-api/holdings.md
      - Synthetic orders: python-api/synthetic-orders.md
      - The account: python-api/account.md
      - The UBI client: python-api/client.md
      - Vocabulary: python-api/vocabulary.md
      - Errors: python-api/errors.md
  - Asset classes:
      - asset-classes/index.md
      - Equities: asset-classes/equities.md
      - Fixed income: asset-classes/fixed-income.md
      - Commodities: asset-classes/commodities.md
      - Currencies: asset-classes/currencies.md
      - Funds and trusts: asset-classes/funds.md
      - Mutual funds: asset-classes/mutual-funds.md
  - Analysis:
      - analysis/index.md
      - Indicators: analysis/indicators.md
      - Candlestick patterns: analysis/patterns.md
      - Statistics and transforms: analysis/statistics.md
      - Signals and backtests: analysis/signals-and-backtests.md
  - Architecture:
      - architecture/index.md
      - The instrument model: architecture/instrument-model.md
      - Placement modes: architecture/placement-modes.md
      - Design choices: architecture/design-choices.md
  - Project:
      - project/index.md
      - Repository structure: project/structure.md
      - Adding an asset class: project/adding-an-asset-class.md
      - Writing these docs: project/writing-docs.md
  - API reference: reference/

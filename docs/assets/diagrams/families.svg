  <path id="families-n1" class="wire" d="M249,380 C249,300 690,320 690,252"/>
  <path id="families-t2" class="wire" d="M348,380 C348,300 220,320 220,252"/>
  <path id="families-n2" class="wire" d="M396,380 C396,300 760,320 760,252"/>
  <path id="families-t3" class="wire" d="M495,380 C495,300 300,320 300,252"/>
  <path id="families-n3" class="wire" d="M543,380 C543,300 830,320 830,252"/>
  <path id="families-t4" class="wire" d="M666,380 C666,300 380,320 380,252"/>
  <path id="families-t5" class="wire" d="M813,380 C813,300 460,320 460,252"/>

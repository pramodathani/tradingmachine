  <text class="mono" x="666" y="402" text-anchor="middle">funds.py</text>
  <text class="small" x="666" y="421" text-anchor="middle">2 classes</text>
  <rect class="box" x="747" y="380" width="132" height="54" rx="6"/>
  <text class="mono" x="813" y="402" text-anchor="middle">mutual_funds.py</text>

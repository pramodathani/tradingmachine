<svg class="tm-svg" viewBox="0 0 900 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="families-title families-description">
  <title id="families-title">How the six asset-class modules inherit from the instrument classes</title>
  <desc id="families-description">Six family modules sit at the bottom. Their cash classes and the funds inherit TradeableInstrument directly, their sixteen futures and option classes inherit the derivative base classes, which inherit TradeableInstrument, and their four index classes inherit NonTradeableInstrument. Both of those inherit Instrument, which also inherits the thirteen analysis classes. Dots travel upward along each inheritance line.</desc>

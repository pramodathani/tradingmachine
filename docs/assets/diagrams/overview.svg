<svg class="tm-svg" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-title overview-description">
  <title id="overview-title">Your program, the library, UBI and ten brokers</title>
  <desc id="overview-description">Quotes, candles, orders and positions flow from ten brokers into the Unified Broker Interface, through the library's shared client, to the instrument objects and the asset baskets, and from there to your program. Asset baskets are also saved to and loaded from this project's MongoDB. Orders go the other way, from a synthetic order or a portfolio through the shared client to UBI, which sends each one to a broker.</desc>

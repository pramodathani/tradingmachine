<svg class="tm-svg" viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-title overview-description">
  <title id="overview-title">Your program, the library, UBI and ten brokers</title>
  <desc id="overview-description">Quotes, candles, orders and positions flow from ten brokers into the Unified Broker Interface, through the library's shared client and instrument objects, to your program. An order goes the other way, from your program through an instrument object and the client to UBI, which sends it to one broker.</desc>

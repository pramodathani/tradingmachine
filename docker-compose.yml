name: tradingmachine

services:
  redis:
    image: redis:trixie
    command: redis-server --requirepass ${TRADINGMACHINE_REDIS_PASSWORD} --appendonly yes
    environment:
      REDIS_PASSWORD: "${TRADINGMACHINE_REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${TRADINGMACHINE_REDIS_PORT:-1001}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - network

  mongodb:
    image: mongo:8.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${TRADINGMACHINE_MONGODB_USERNAME:-tradingmachine}"
      MONGO_INITDB_ROOT_PASSWORD: "${TRADINGMACHINE_MONGODB_PASSWORD}"
    ports:
      - "127.0.0.1:${TRADINGMACHINE_MONGODB_PORT:-1002}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.runCommand({ping:1})' --quiet"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - network

  timescaledb:
    image: timescale/timescaledb:latest-pg18
    shm_size: 256m
    environment:
      PGDATA: /pgdata
      POSTGRES_DB: "${TRADINGMACHINE_POSTGRES_DATABASE:-tradingmachine}"
      POSTGRES_USER: "${TRADINGMACHINE_POSTGRES_USERNAME:-tradingmachine}"
      POSTGRES_PASSWORD: "${TRADINGMACHINE_POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${TRADINGMACHINE_POSTGRES_PORT:-1003}:5432"
    volumes:
      - timescaledb_data:/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - network

  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:${TRADINGMACHINE_CHROMADB_PORT:-1004}:8000"
    volumes:
      - chromadb_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - network

volumes:
  redis_data:
    name: tradingmachine_redis_volume
  mongodb_data:
    name: tradingmachine_mongodb_volume
  timescaledb_data:
    name: tradingmachine_timescaledb_volume
  chromadb_data:
    name: tradingmachine_chromadb_volume

networks:
  network:
    name: tradingmachine_network
    driver: bridge
